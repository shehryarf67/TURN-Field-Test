name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Optional: sign with the team's debug key so builds install over an existing app without uninstalling.
      # Without the secret, Gradle generates a fresh debug key and the first install needs an uninstall.
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "TURN_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No DEBUG_KEYSTORE_B64 secret; using a generated debug key"
          fi
      - name: Unit tests
        run: ./gradlew test --no-daemon --max-workers=2
      - name: Lint and debug APK
        run: ./gradlew lintDebug assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: turn-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Every green build of main replaces one rolling pre-release, so a single permanent link
  # (…/releases/download/latest-debug/turn-debug.apk) always serves the newest APK.
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest-debug
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: turn-debug-apk
      - name: Replace the latest-debug release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk turn-debug.apk
          gh release delete latest-debug --cleanup-tag --yes || true
          gh release create latest-debug turn-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest debug build (${GITHUB_SHA::7})" \
            --notes "Debug APK built from ${GITHUB_SHA} on main. Replaced automatically on every push to main."
